<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>총 강화하기</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    background: #12141a; color: #e8e8e8; min-height: 100vh;
    display: flex; justify-content: center; padding: 12px;
  }
  .wrap { width: 100%; max-width: 480px; }
  h1 { text-align: center; font-size: 22px; margin: 6px 0 12px; letter-spacing: 2px; }
  .bar {
    display: flex; justify-content: space-between; gap: 8px;
    background: #1d2029; border-radius: 10px; padding: 10px 12px; font-size: 14px;
  }
  .bar b { color: #ffd54a; }
  .stage {
    margin-top: 12px; background: radial-gradient(circle at 50% 45%, #2a2f3d, #171a22 70%);
    border-radius: 14px; padding: 18px 10px 14px; text-align: center; position: relative; overflow: hidden;
  }
  .lvl { font-size: 40px; font-weight: 800; }
  .gname { font-size: 18px; margin-top: 2px; font-weight: 700; }
  .gun-box { height: 150px; display: flex; align-items: center; justify-content: center; margin: 8px 0; }
  .gun-box svg { width: 92%; max-width: 360px; transition: filter .3s; }
  .shake { animation: shake .5s; }
  @keyframes shake {
    0%,100% { transform: translateX(0); } 20% { transform: translateX(-8px) rotate(-2deg); }
    40% { transform: translateX(8px) rotate(2deg); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); }
  }
  .flash { position: absolute; inset: 0; pointer-events: none; opacity: 0; }
  .flash.go { animation: flash .7s; }
  @keyframes flash { 0% { opacity: .85; } 100% { opacity: 0; } }
  .msg { min-height: 24px; font-size: 16px; font-weight: 700; margin-top: 4px; }
  .info { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-top: 12px; font-size: 13px; }
  .info div { background: #1d2029; border-radius: 8px; padding: 8px; text-align: center; }
  .info span { display: block; font-size: 16px; font-weight: 700; margin-top: 2px; }
  .btns { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; margin-top: 12px; }
  button {
    border: 0; border-radius: 10px; padding: 14px 8px; font-size: 16px; font-weight: 800;
    color: #fff; cursor: pointer; font-family: inherit;
  }
  button:disabled { opacity: .45; cursor: default; }
  .up { background: linear-gradient(#ff7a2f, #e04a10); font-size: 20px; }
  .sell { background: linear-gradient(#3aa76d, #23794c); }
  .row { display: flex; gap: 8px; margin-top: 8px; align-items: center; }
  .row button { flex: 1; background: #2e3442; font-size: 14px; padding: 10px; }
  .chk { display: flex; align-items: center; gap: 6px; font-size: 14px; background: #1d2029; padding: 10px; border-radius: 10px; flex: 1.3; }
  .chk input { width: 18px; height: 18px; }
  .log { margin-top: 12px; background: #1d2029; border-radius: 10px; padding: 10px; font-size: 13px; max-height: 170px; overflow-y: auto; }
  .log p { padding: 3px 0; border-bottom: 1px solid #262a35; }
  .ok { color: #6be38f; } .bad { color: #ff6b6b; } .keep { color: #aab; } .gold { color: #ffd54a; }
  .foot { text-align: center; font-size: 12px; color: #778; margin: 12px 0; }
  .foot a { color: #889; cursor: pointer; text-decoration: underline; }
</style>
</head>
<body>
<div class="wrap">
  <h1>🔫 총 강화하기</h1>
  <div class="bar">
    <div>💰 <b id="gold">0</b> G</div>
    <div>🛡️ 보험 <b id="prot">0</b>개</div>
    <div>🏆 최고 <b id="best">+0</b></div>
  </div>

  <div class="stage" id="stage">
    <div class="flash" id="flash"></div>
    <div class="lvl" id="lvl">+0</div>
    <div class="gname" id="gname"></div>
    <div class="gun-box"><div id="gun"></div></div>
    <div class="msg" id="msg">강화 버튼을 눌러보세요!</div>
  </div>

  <div class="info">
    <div>성공 확률<span id="rate" class="ok">-</span></div>
    <div>파괴 확률<span id="destroy" class="bad">-</span></div>
    <div>강화 비용<span id="cost" class="gold">-</span></div>
    <div>판매 가격<span id="price" class="gold">-</span></div>
  </div>

  <div class="btns">
    <button class="up" id="upBtn">⚒️ 강화하기</button>
    <button class="sell" id="sellBtn">판매</button>
  </div>
  <div class="row">
    <label class="chk"><input type="checkbox" id="useProt"> 파괴 시 보험 사용</label>
    <button id="buyProt">보험 구매</button>
  </div>

  <div class="log" id="log"></div>
  <div class="foot">진행 상황은 브라우저에 자동 저장됩니다 · <a id="reset">처음부터 다시</a></div>
</div>

<script>
const MAX = 30;

// 단계별 총 이름
const NAMES = [
  "녹슨 새총", "나무 고무줄총", "장난감 물총", "BB탄 권총", "낡은 리볼버",
  "경찰용 권총", "개조 권총", "더블 배럴 산탄총", "펌프 액션 샷건", "기관단총",
  "돌격 소총", "정밀 카빈", "전투 소총", "저격 소총", "대물 저격총",
  "경기관총", "미니건", "레일건 시제품", "플라즈마 라이플", "전자기 레일건",
  "양자 저격총", "중력 붕괴포", "블랙홀 캐논", "항성 파괴포", "은하 절단기",
  "차원 관통총", "시간 역행 리볼버", "운명 결정자", "창조주의 방아쇠", "무한의 총구",
  "★ 전설의 총 ★"
];

// 성공 확률(%) — 인덱스 = 현재 단계
const RATE = [100,95,90,85,80,75,70,65,60,55, 50,47,44,41,38,35,32,29,26,23, 20,17,15,13,11,9,7,6,5,4];
// 실패 시 파괴 확률(%) — 실패했을 때 중 몇 %가 파괴인지
const DESTROY = (l) => l < 5 ? 0 : Math.min(85, (l - 4) * 4 + 10);
const COST  = (l) => Math.floor(100 * Math.pow(1.35, l) / 10) * 10;
const PRICE = (l) => l === 0 ? 0 : Math.floor(60 * Math.pow(1.62, l) / 10) * 10;
const PROT_PRICE = (l) => Math.max(5000, Math.floor(PRICE(l) * 0.25 / 100) * 100);

const DEFAULT = { gold: 20000, level: 0, prot: 0, best: 0, tries: 0, broke: 0 };
let S = load();
let busy = false;

function load() {
  try { return Object.assign({}, DEFAULT, JSON.parse(localStorage.getItem("gunUpgrade") || "{}")); }
  catch { return { ...DEFAULT }; }
}
function save() { try { localStorage.setItem("gunUpgrade", JSON.stringify(S)); } catch {} }

// 팝업 대신 "한 번 더 누르면 실행" 확인
let armed = null, armTimer = null;
function confirmTap(btn, label) {
  if (armed === btn) { disarm(); return true; }
  disarm();
  armed = btn; btn.dataset.orig = btn.textContent; btn.textContent = label;
  armTimer = setTimeout(() => { disarm(); render(); }, 2500);
  return false;
}
function disarm() {
  if (armed) { armed.textContent = armed.dataset.orig; armed = null; }
  clearTimeout(armTimer);
}
const fmt = (n) => n.toLocaleString("ko-KR");
const $ = (id) => document.getElementById(id);

// 단계별 색상
function tierColor(l) {
  if (l >= 30) return ["#ffef7a", "#ff4df0"];
  if (l >= 25) return ["#ff4d6d", "#ffb84d"];
  if (l >= 20) return ["#c070ff", "#ff70d0"];
  if (l >= 15) return ["#4dd2ff", "#a07dff"];
  if (l >= 10) return ["#ffcc33", "#ff8c1a"];
  if (l >= 5)  return ["#c8d0dc", "#7d8796"];
  return ["#8a6d4e", "#5a4632"];
}

// 레벨에 따라 길어지고 화려해지는 총 SVG
function gunSVG(l) {
  const [c1, c2] = tierColor(l);
  const len = 120 + Math.min(l, 30) * 6;         // 총열 길이
  const scope = l >= 12;
  const mag = l >= 9;
  const glow = l >= 10 ? `drop-shadow(0 0 ${4 + (l - 10)}px ${c1})` : "none";
  const w = 140 + len;
  return `
  <svg viewBox="0 0 ${w} 120" style="filter:${glow}">
    <defs>
      <linearGradient id="g" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/>
      </linearGradient>
    </defs>
    <!-- 개머리판 -->
    <path d="M10 40 L60 38 L60 62 L22 80 L10 78 Z" fill="${c2}" stroke="#111" stroke-width="2"/>
    <!-- 몸체 -->
    <rect x="55" y="30" width="90" height="32" rx="5" fill="url(#g)" stroke="#111" stroke-width="2"/>
    <!-- 총열 -->
    <rect x="140" y="36" width="${len}" height="12" rx="3" fill="url(#g)" stroke="#111" stroke-width="2"/>
    <rect x="${130 + len}" y="33" width="10" height="18" rx="2" fill="${c2}" stroke="#111" stroke-width="2"/>
    <!-- 손잡이 -->
    <path d="M85 60 L110 60 L102 100 L78 100 Z" fill="${c2}" stroke="#111" stroke-width="2"/>
    <!-- 방아쇠 -->
    <path d="M112 62 q6 14 -6 18" fill="none" stroke="#111" stroke-width="3"/>
    ${mag ? `<rect x="118" y="60" width="16" height="34" rx="3" fill="${c1}" stroke="#111" stroke-width="2"/>` : ""}
    ${scope ? `<rect x="80" y="14" width="60" height="14" rx="7" fill="#222" stroke="${c1}" stroke-width="2"/>
               <circle cx="140" cy="21" r="6" fill="${c1}"/>` : ""}
    ${l >= 20 ? `<circle cx="100" cy="46" r="7" fill="#fff" opacity=".85"/>` : ""}
  </svg>`;
}

function render() {
  const l = S.level;
  $("gold").textContent = fmt(S.gold);
  $("prot").textContent = S.prot;
  $("best").textContent = "+" + S.best;
  $("lvl").textContent = "+" + l;
  $("lvl").style.color = tierColor(l)[0];
  $("gname").textContent = NAMES[l];
  $("gun").innerHTML = gunSVG(l);
  $("price").textContent = l === 0 ? "-" : fmt(PRICE(l)) + " G";
  $("buyProt").textContent = `보험 구매 (${fmt(PROT_PRICE(l))} G)`;
  if (l >= MAX) {
    $("rate").textContent = "MAX"; $("destroy").textContent = "-"; $("cost").textContent = "-";
    $("upBtn").disabled = true; $("upBtn").textContent = "🏆 최대 강화!";
  } else {
    $("rate").textContent = RATE[l] + "%";
    $("destroy").textContent = (DESTROY(l) * (100 - RATE[l]) / 100).toFixed(1) + "%";
    $("cost").textContent = fmt(COST(l)) + " G";
    $("upBtn").disabled = busy || S.gold < COST(l);
    $("upBtn").textContent = "⚒️ 강화하기";
  }
  $("sellBtn").disabled = busy || l === 0;
  $("buyProt").disabled = busy || S.gold < PROT_PRICE(l);
  checkBankrupt();
}

function log(text, cls) {
  const p = document.createElement("p");
  p.className = cls; p.textContent = text;
  $("log").prepend(p);
  while ($("log").children.length > 50) $("log").lastChild.remove();
}
function msg(text, cls) { $("msg").className = "msg " + cls; $("msg").textContent = text; }
function flash(color) {
  const f = $("flash"); f.style.background = color;
  f.classList.remove("go"); void f.offsetWidth; f.classList.add("go");
}

function upgrade() {
  disarm();
  const l = S.level, cost = COST(l);
  if (busy || l >= MAX || S.gold < cost) return;
  busy = true; S.gold -= cost; S.tries++;
  msg("강화 중...", "keep");
  $("gun").classList.add("shake");
  render();

  setTimeout(() => {
    $("gun").classList.remove("shake");
    const r = Math.random() * 100;
    if (r < RATE[l]) {
      S.level++;
      if (S.level > S.best) S.best = S.level;
      msg(`성공! +${S.level} ${NAMES[S.level]}`, "ok");
      log(`✅ +${l} → +${S.level} 강화 성공`, "ok");
      flash(S.level >= 20 ? "#ffe066" : "#6be38f");
    } else if (Math.random() * 100 < DESTROY(l)) {
      if ($("useProt").checked && S.prot > 0) {
        S.prot--;
        msg("파괴될 뻔! 보험으로 지켜냈다", "keep");
        log(`🛡️ +${l} 파괴 → 보험 사용으로 유지`, "keep");
        flash("#4da3ff");
      } else {
        S.level = 0; S.broke++;
        msg(`💥 펑! +${l} 총이 박살났습니다...`, "bad");
        log(`💥 +${l} ${NAMES[l]} 파괴`, "bad");
        flash("#ff3030");
      }
    } else {
      msg("실패... 단계는 유지됩니다", "keep");
      log(`❌ +${l} 강화 실패 (유지)`, "keep");
      flash("#555");
    }
    busy = false; save(); render();
  }, 700);
}

function sell() {
  if (busy || S.level === 0) return;
  const p = PRICE(S.level);
  if (!confirmTap($("sellBtn"), "한번 더 눌러 판매")) return;
  S.gold += p;
  log(`💰 +${S.level} 판매 → ${fmt(p)} G`, "gold");
  msg(`${fmt(p)} G 획득! 새 총으로 다시 시작`, "gold");
  S.level = 0; save(); render();
}

function buyProt() {
  const p = PROT_PRICE(S.level);
  if (busy || S.gold < p) return;
  S.gold -= p; S.prot++;
  log(`🛡️ 파괴 보험 구매 (-${fmt(p)} G)`, "keep");
  save(); render();
}

// 돈이 없고 팔 총도 없으면 지원금
function checkBankrupt() {
  if (!busy && S.level === 0 && S.gold < COST(0)) {
    S.gold += 5000;
    log("🆘 파산! 정부 지원금 5,000 G 지급", "gold");
    msg("파산... 지원금을 받았습니다", "gold");
    save(); render();
  }
}

$("upBtn").onclick = upgrade;
$("sellBtn").onclick = sell;
$("buyProt").onclick = buyProt;
$("reset").onclick = () => {
  if (!confirmTap($("reset"), "정말 초기화하려면 한번 더 누르세요")) return;
  S = { ...DEFAULT }; $("log").innerHTML = ""; save(); render();
  msg("강화 버튼을 눌러보세요!", "keep");
};
document.addEventListener("keydown", (e) => { if (e.code === "Space") { e.preventDefault(); upgrade(); } });

render();
</script>
</body>
</html>

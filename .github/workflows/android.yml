name: Android build (원터치 클리너)

on:
  push:
    paths:
      - "onetouch-cleaner/**"
      - ".github/workflows/android.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: onetouch-cleaner
    env:
      VERSION_CODE: ${{ github.run_number }}
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_REWARDED_ID: ${{ secrets.ADMOB_REWARDED_ID }}
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK (폰 설치 테스트용)
        run: ./gradlew --no-daemon assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: onetouch-cleaner-debug-apk
          path: onetouch-cleaner/app/build/outputs/apk/debug/*.apk

      # 아래는 GitHub Secrets 에 업로드 키가 등록된 경우에만 실행 (Play 업로드용 AAB)
      - name: Decode upload keystore
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"

      - name: Build signed release AAB
        if: ${{ env.HAS_KEY == 'true' }}
        env:
          KEYSTORE_PATH: ${{ runner.temp }}/upload.jks
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew --no-daemon bundleRelease

      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('onetouch-cleaner/app/build/outputs/bundle/release/*.aab') != '' }}
        with:
          name: onetouch-cleaner-release-aab
          path: onetouch-cleaner/app/build/outputs/bundle/release/*.aab

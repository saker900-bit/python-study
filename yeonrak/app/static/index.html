<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ff7a59">
<link rel="manifest" href="/static/manifest.json">
<title>연락각</title>
<style>
  :root { --main:#ff7a59; --bg:#fff7f2; --card:#fff; --text:#2b2b2b; --muted:#8a8a8a; --danger:#e5484d; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
         background:var(--bg); color:var(--text); }
  header { padding:20px 16px 8px; }
  h1 { margin:0; font-size:24px; } h1 span { color:var(--main); }
  main { padding:8px 16px 80px; max-width:520px; margin:0 auto; }
  .card { background:var(--card); border-radius:16px; padding:16px; margin:12px 0; box-shadow:0 2px 10px rgba(0,0,0,.05); }
  .row { display:flex; gap:8px; align-items:center; }
  .muted { color:var(--muted); font-size:13px; }
  input, select { width:100%; padding:12px; border:1px solid #eee; border-radius:10px; font-size:15px; margin:4px 0; }
  button { border:0; border-radius:10px; padding:12px; font-size:15px; font-weight:600; cursor:pointer; }
  .primary { background:var(--main); color:#fff; } .ghost { background:#f3f3f3; color:var(--text); }
  .danger { background:#fff0f0; color:var(--danger); }
  .grow { flex:1; }
  .bar { height:10px; background:#f1f1f1; border-radius:5px; overflow:hidden; margin:10px 0 4px; }
  .bar > div { height:100%; background:var(--main); transition:width .3s; }
  .overdue .bar > div { background:var(--danger); }
  .name { font-size:18px; font-weight:700; } .tag { font-size:12px; background:#ffeee8; color:var(--main); border-radius:6px; padding:2px 6px; }
  .ai { background:#f6f3ff; border-radius:10px; padding:10px 12px; margin-top:10px; font-size:14px; display:none; }
  .code { font-family:monospace; font-size:22px; letter-spacing:3px; font-weight:700; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); background:#333; color:#fff;
           padding:12px 16px; border-radius:12px; font-size:14px; opacity:0; transition:opacity .3s; max-width:90%; z-index:9; }
  #toast.show { opacity:1; }
  .hidden { display:none !important; }
  details summary { cursor:pointer; font-weight:600; }
</style>
</head>
<body>
<header><h1>연락<span>각</span></h1><div class="muted">이쯤 되면 연락할 각</div></header>
<main>
  <!-- 가입 -->
  <section id="signup" class="card hidden">
    <div class="name">반가워요 👋</div>
    <p class="muted">이름만 있으면 시작할 수 있어요.</p>
    <input id="su-name" placeholder="내 이름">
    <button class="primary" style="width:100%" onclick="signup()">시작하기</button>
  </section>

  <!-- 홈 -->
  <section id="home" class="hidden">
    <div class="card">
      <div class="row"><div class="grow"><div class="muted">내 초대 코드 (상대에게 알려주세요)</div>
        <div class="code" id="my-code"></div></div>
        <button class="ghost" onclick="enableNoti()" id="noti-btn">🔔 알림 켜기</button></div>
      <div class="row" style="margin-top:10px">
        <input id="my-status" class="grow" placeholder="내 상태 (예: 회식 중, 운동 중)">
        <button class="ghost" onclick="saveStatus()">저장</button>
      </div>
      <div class="muted">상태를 남기면 상대 쪽 AI가 참고해서 안심시켜줘요.</div>
    </div>

    <div id="links"></div>

    <div class="card">
      <details>
        <summary>➕ 새 상대 연결하기</summary>
        <input id="ln-code" placeholder="상대의 초대 코드">
        <select id="ln-rel" onchange="relChanged()">
          <option value="dating">연인 (기본 6시간)</option>
          <option value="spouse">배우자 (기본 4시간)</option>
          <option value="parent">부모님 (기본 3일)</option>
          <option value="child">자녀 (기본 3일)</option>
          <option value="friend">친구 (기본 1주)</option>
        </select>
        <input id="ln-them" placeholder="내가 상대를 부르는 이름 (예: 엄마)">
        <input id="ln-me" placeholder="상대가 나를 부르는 이름 (예: 아들)">
        <input id="ln-hours" type="number" min="1" placeholder="연락 텀 (시간, 비우면 기본값)">
        <button class="primary" style="width:100%" onclick="createLink()">연결하기</button>
      </details>
    </div>
  </section>
</main>
<div id="toast"></div>

<script>
const $ = (id) => document.getElementById(id);
let token = localStorage.getItem("token");

async function api(path, opts = {}) {
  const res = await fetch(path, {
    ...opts,
    headers: { "Content-Type": "application/json", "X-Token": token || "", ...(opts.headers || {}) },
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(typeof data.detail === "string" ? data.detail : "문제가 생겼어요");
  return data;
}
function toast(msg) { const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), 2500); }
function esc(s) { return String(s ?? "").replace(/[&<>"']/g, (c) => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function fmtHours(h) {
  if (h < 1) return `${Math.round(h * 60)}분`;
  if (h < 48) return `${Math.floor(h)}시간`;
  return `${Math.floor(h / 24)}일`;
}

async function signup() {
  const name = $("su-name").value.trim(); if (!name) return toast("이름을 적어주세요");
  const u = await api("/api/users", { method: "POST", body: JSON.stringify({ name }) });
  token = u.token; localStorage.setItem("token", token); boot();
}

async function boot() {
  if (!token) { $("signup").classList.remove("hidden"); return; }
  try {
    const me = await api("/api/me");
    $("signup").classList.add("hidden"); $("home").classList.remove("hidden");
    $("my-code").textContent = me.invite_code; $("my-status").value = me.status || "";
    if ("Notification" in window && Notification.permission === "granted") $("noti-btn").classList.add("hidden");
    await loadLinks(); poll(); setInterval(poll, 15000); setInterval(loadLinks, 60000);
  } catch (e) { localStorage.removeItem("token"); token = null; boot(); }
}

async function loadLinks() {
  const links = await api("/api/links");
  $("links").innerHTML = links.length ? links.map(card).join("") :
    `<div class="card muted">아직 연결된 사람이 없어요. 아래에서 초대 코드로 연결해보세요.</div>`;
}

function card(l) {
  const left = l.threshold_hours - l.hours_since;
  const state = l.overdue ? `⏰ 연락할 각! (${fmtHours(-left)} 지남)` : `${fmtHours(left)} 남음`;
  return `<div class="card ${l.overdue ? "overdue" : ""}" id="link-${l.id}">
    <div class="row"><div class="name grow">${esc(l.their_name)} <span class="tag">${esc(l.relation_ko)}</span></div>
      <div class="muted">${state}</div></div>
    <div class="bar"><div style="width:${l.progress * 100}%"></div></div>
    <div class="muted">마지막 연락 ${fmtHours(l.hours_since)} 전 · 텀 ${fmtHours(l.threshold_hours)}
      ${l.their_status ? ` · 상태: ${esc(l.their_status)}` : ""}</div>
    <div class="row" style="margin-top:12px">
      <button class="primary grow" onclick="contact(${l.id})">📞 연락했어요</button>
      <button class="danger grow" onclick="nudge(${l.id})">📢 야 연락 안 하냐?</button>
    </div>
    <div class="row" style="margin-top:8px">
      <button class="ghost grow" onclick="reassure(${l.id})">🤔 왜 연락이 없지?</button>
      <button class="ghost" onclick="setTerm(${l.id}, ${l.threshold_hours})">⚙️ 텀</button>
    </div>
    <div class="ai" id="ai-${l.id}"></div>
  </div>`;
}

async function contact(id) { await api(`/api/links/${id}/contact`, { method: "POST" }); toast("연락 완료! 타이머 초기화 ✅"); loadLinks(); }
async function nudge(id) {
  try { await api(`/api/links/${id}/nudge`, { method: "POST" }); toast("재촉 알림 보냈어요 📢"); }
  catch (e) { toast(e.message); }
}
async function reassure(id) {
  const box = $(`ai-${id}`); box.style.display = "block"; box.textContent = "생각 중... 🤔";
  try { const r = await api(`/api/links/${id}/reassure`); box.textContent = (r.source === "ai" ? "🤖 " : "💭 ") + r.message; }
  catch (e) { box.textContent = e.message; }
}
async function setTerm(id, cur) {
  const v = prompt("몇 시간마다 연락할까요?", cur); if (!v) return;
  try { await api(`/api/links/${id}`, { method: "PATCH", body: JSON.stringify({ threshold_hours: Number(v) }) }); loadLinks(); }
  catch (e) { toast(e.message); }
}
async function saveStatus() {
  await api("/api/me/status", { method: "POST", body: JSON.stringify({ status: $("my-status").value }) });
  toast("상태 저장했어요");
}
const DEFAULT_NAMES = { dating: ["자기", "자기"], spouse: ["여보", "여보"], parent: ["엄마", ""], child: ["", "엄마"], friend: ["", ""] };
function relChanged() {
  const [a] = DEFAULT_NAMES[$("ln-rel").value];
  if (!$("ln-them").value) $("ln-them").placeholder = `내가 상대를 부르는 이름${a ? ` (예: ${a})` : ""}`;
}
async function createLink() {
  const body = { invite_code: $("ln-code").value, relation: $("ln-rel").value,
    i_call_them: $("ln-them").value.trim(), they_call_me: $("ln-me").value.trim() };
  const h = Number($("ln-hours").value); if (h > 0) body.threshold_hours = h;
  if (!body.invite_code || !body.i_call_them || !body.they_call_me) return toast("빈칸을 채워주세요");
  try { await api("/api/links", { method: "POST", body: JSON.stringify(body) }); toast("연결됐어요 🔗");
    ["ln-code", "ln-them", "ln-me", "ln-hours"].forEach((i) => ($(i).value = "")); loadLinks(); }
  catch (e) { toast(e.message); }
}

// ---- 알림 ----
let swReg = null;
if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js").then((r) => (swReg = r));
async function enableNoti() {
  if (!("Notification" in window)) return toast("이 브라우저는 알림을 지원하지 않아요");
  const p = await Notification.requestPermission();
  if (p === "granted") { $("noti-btn").classList.add("hidden"); toast("알림을 켰어요 🔔"); }
}
async function poll() {
  try {
    const list = await api("/api/notifications");
    for (const n of list) {
      if ("Notification" in window && Notification.permission === "granted") {
        const opts = { body: n.body, tag: `n${n.id}` };
        swReg ? swReg.showNotification(n.title, opts) : new Notification(n.title, opts);
      } else toast(`${n.title} — ${n.body}`);
    }
    if (list.length) loadLinks();
  } catch (e) {}
}
boot();
</script>
</body>
</html>
